services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:code-nonroot
    environment:
      HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-on}
      HEADROOM_COMPRESS_USER_MESSAGES: "${HEADROOM_COMPRESS_USER_MESSAGES:-1}"
      HEADROOM_COMPRESS_ALLOW_REMOTE: "${HEADROOM_COMPRESS_ALLOW_REMOTE:-1}"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_API_KEY:-}
    volumes:
      - headroom-data:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
volumes:
  headroom-data:
networks:
  internal:
    name: ${INTERNAL_NETWORK:-llmproxy}
    external: true
