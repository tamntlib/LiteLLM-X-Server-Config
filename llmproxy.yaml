# Environment variables: follow .env.example file
volumes:
  cli-proxy-api-auth-data:
  cli-proxy-api-config-data:
  cli-proxy-api-usage-data:
  headroom-data:

x-common-healthcheck: &common-healthcheck
  interval: 30s # Perform health check every 30 seconds
  timeout: 10s # Health check command times out after 10 seconds
  retries: 3 # Retry up to 3 times if health check fails

x-common-deploy: &common-deploy
  replicas: 1
  update_config:
    parallelism: 1
    delay: 10s
    order: start-first
    failure_action: rollback
  rollback_config:
    parallelism: 1
    delay: 10s
    order: stop-first

x-stop-first-deploy: &stop-first-deploy
  <<: *common-deploy
  update_config:
    parallelism: 1
    delay: 10s
    order: stop-first
    failure_action: rollback

x-cli-proxy-api: &cli-proxy-api
  image: eceasy/cli-proxy-api
  command:
    - sh
    - -c
    - |
      if [ ! -f /CLIProxyAPI/config/config.yaml ]; then
        cp /CLIProxyAPI/config_ro/config.yaml /CLIProxyAPI/config/config.yaml
      fi
      exec ./CLIProxyAPI --config /CLIProxyAPI/config/config.yaml
  environment:
    TZ: ${TZ:-UTC}
  healthcheck:
    <<: *common-healthcheck
    test:
    - CMD-SHELL
    - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8317 && printf \"GET / HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && read -r status <&3 && [[ \"$$status\" == HTTP/*\" 2\"* || \"$$status\" == HTTP/*\" 3\"* ]]'"
    start_period: 10s
  networks:
    - internal
    - public
    - monitoring

services:
  cli-proxy-api:
    <<: *cli-proxy-api
    volumes:
      - cli-proxy-api-config-data:/CLIProxyAPI/config
      - cli-proxy-api-auth-data:/CLIProxyAPI/auth
    configs:
      - source: cli-proxy-api-config-yaml
        target: /CLIProxyAPI/config_ro/config.yaml
    deploy:
      <<: *common-deploy
      labels:
        - traefik.enable=true
        - traefik.http.routers.cli-proxy-api.rule=Host(`${CLI_PROXY_API_HOST}`)
        - traefik.http.routers.cli-proxy-api.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
        - traefik.http.routers.cli-proxy-api.tls=${TRAEFIK_ROUTER_TLS:-true}
        - traefik.http.routers.cli-proxy-api.tls.certresolver=${LETSENCRYPT_RESOLVER:-le}
        - traefik.http.services.cli-proxy-api.loadbalancer.server.port=8317
        - traefik.http.routers.cli-proxy-api.service=cli-proxy-api

  cli-proxy-api-usage:
    image: ghcr.io/willxup/cpa-usage-keeper
    environment:
      TZ: ${TZ:-UTC}
      CPA_BASE_URL: http://cli-proxy-api:8317
      CPA_MANAGEMENT_KEY: ${CLI_PROXY_API_MANAGEMENT_KEY}
      REDIS_QUEUE_ADDR: cli-proxy-api:8317
      AUTH_ENABLED: ${CLI_PROXY_API_USAGE_AUTH_ENABLED:-true}
      LOGIN_PASSWORD: ${CLI_PROXY_API_USAGE_LOGIN_PASSWORD}
    volumes:
      - cli-proxy-api-usage-data:/data
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      start_period: 10s
    networks:
      - internal
      - public
    deploy:
      <<: *common-deploy
      labels:
        - traefik.enable=true
        - traefik.http.routers.cli-proxy-api-usage.rule=Host(`${CLI_PROXY_API_USAGE_HOST}`)
        - traefik.http.routers.cli-proxy-api-usage.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
        - traefik.http.routers.cli-proxy-api-usage.tls=${TRAEFIK_ROUTER_TLS:-true}
        - traefik.http.routers.cli-proxy-api-usage.tls.certresolver=${LETSENCRYPT_RESOLVER:-le}
        - traefik.http.services.cli-proxy-api-usage.loadbalancer.server.port=8080
        - traefik.http.routers.cli-proxy-api-usage.service=cli-proxy-api-usage

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:code-nonroot
    environment:
      HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-on}
      HEADROOM_COMPRESS_USER_MESSAGES: "${HEADROOM_COMPRESS_USER_MESSAGES:-1}"
      HEADROOM_COMPRESS_ALLOW_REMOTE: "${HEADROOM_COMPRESS_ALLOW_REMOTE:-1}"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_API_KEY:-}
    volumes:
      - headroom-data:/home/nonroot/.headroom
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      start_period: 20s
    networks:
      - internal
      - public
      - monitoring
    deploy:
      <<: *common-deploy
      labels:
        - traefik.enable=true
        - traefik.docker.network=${PUBLIC_NETWORK:-public}
        - traefik.http.routers.headroom-dashboard.rule=Host(`${HEADROOM_HOST}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/stats`) || Path(`/health`) || Path(`/favicon.ico`))
        - traefik.http.routers.headroom-dashboard.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
        - traefik.http.routers.headroom-dashboard.tls=${TRAEFIK_ROUTER_TLS:-true}
        - traefik.http.routers.headroom-dashboard.tls.certresolver=${LETSENCRYPT_RESOLVER:-le}
        - traefik.http.routers.headroom-dashboard.service=headroom-dashboard
        - traefik.http.services.headroom-dashboard.loadbalancer.server.port=8787
        - traefik.http.routers.headroom-dashboard.middlewares=headroom-dashboard-auth,headroom-dashboard-token
        - traefik.http.middlewares.headroom-dashboard-auth.basicauth.users=${HEADROOM_BASIC_AUTH}
        - traefik.http.middlewares.headroom-dashboard-auth.basicauth.removeheader=true
        - traefik.http.middlewares.headroom-dashboard-token.headers.customrequestheaders.X-Headroom-Proxy-Token=${HEADROOM_API_KEY}

  litellm:
    image: tamntlib/litellm-database
    command: ["--config", "/app/config.yaml", "--num_workers", "1", "--use_v2_migration_resolver"]
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-app}:${DB_PASSWORD:-app_db_PW@2018}@${DB_HOST:-llmproxy-data_db}:5432/${DB_NAME:-app}"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-litellm_master_key}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-litellm_salt_key}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LITELLM_LICENSE: ${LITELLM_LICENSE:-}
      LITELLM_MODE: PRODUCTION
      LITELLM_LOG: ERROR
      JSON_LOGS: "True"
      USE_PRISMA_MIGRATE: "True"
      LITELLM_DROP_PARAMS: "True"
      CLAUDE_CODE_MODELS: ${CLAUDE_CODE_MODELS:-claude-*}
      CLAUDE_CODE_MIN_VERSION: "${CLAUDE_CODE_MIN_VERSION:-2.1.140}"
      LITELLM_VISION_MODEL_ROUTER_MODELS: ${LITELLM_VISION_MODEL_ROUTER_MODELS:-anthropic/primary,anthropic/secondary,anthropic/tertiary,openai/primary,openai/secondary,openai/tertiary}
      CONTENT_PREVIEW_MAX_LENGTH: ${CONTENT_PREVIEW_MAX_LENGTH:-100}
      USER_TEXT_PREVIEW_MAX_LENGTH: ${USER_TEXT_PREVIEW_MAX_LENGTH:-2048}
    configs:
      - source: litellm-config-yaml
        target: /app/config.yaml
    healthcheck: # Defines the health check configuration for the container
      <<: *common-healthcheck
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')" # Command to execute for health check
      start_period: 60s # Wait 60 seconds after container start before beginning health checks
    networks:
      - internal
      - public
      - monitoring
    deploy:
      <<: *stop-first-deploy
      labels:
        - traefik.enable=true
        - traefik.http.routers.litellm.rule=Host(`${LITELLM_HOST}`)
        - traefik.http.routers.litellm.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
        - traefik.http.routers.litellm.tls=${TRAEFIK_ROUTER_TLS:-true}
        - traefik.http.routers.litellm.tls.certresolver=${LETSENCRYPT_RESOLVER:-le}
        - traefik.http.services.litellm.loadbalancer.server.port=4000
        - traefik.http.routers.litellm.service=litellm

configs:
  cli-proxy-api-config-yaml:
    name: ${CLI_PROXY_API_CONFIG_NAME:-llmproxy_cli-proxy-api-config-yaml}
    external: true
  litellm-config-yaml:
    name: ${LITELLM_CONFIG_NAME:-llmproxy_litellm-config-yaml}
    external: true

networks:
  internal:
    name: ${INTERNAL_NETWORK:-llmproxy}
    external: true
  public:
    name: ${PUBLIC_NETWORK:-public}
    external: true
  monitoring:
    name: ${MONITORING_NETWORK:-monitoring}
    external: true
