[project]
name = "llmproxy"
version = "0.1.0"
description = "Component-first Docker Swarm deployment and LiteLLM management CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llmproxy = "llmproxy.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["llmproxy/__init__.py"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/hatch_build.py",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.local.*",
  "**/*.local.yaml",
  "**/*.local*/**",
  "**/.env*",
  "**/.env*/**",
  "**/config.gen.json",
  "**/openapi.json",
  "/build",
  "/dist",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"
